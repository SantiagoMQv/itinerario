<!doctype html>
<html lang="es" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a8804f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Itinerario" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icono-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Itinerario</title>
  </head>
  <body>
    <div id="mapa"></div>

    <header id="barra">
      <nav id="dias" aria-label="Días del viaje"></nav>
      <p id="aviso" hidden></p>
    </header>

    <div id="botones-mapa">
      <button id="btn-encuadrar" class="btn-redondo" type="button" title="Ver todo el día" aria-label="Ver todo el día">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" /><circle cx="12" cy="12" r="2" class="relleno" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" /></svg>
      </button>
      <button id="btn-offline" class="btn-redondo" type="button" title="Guardar mapas sin conexión" aria-label="Guardar mapas sin conexión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10.5m0 0-4.5-4.5M12 14.5l4.5-4.5M5 19.5h14" /></svg>
      </button>
      <button id="btn-tema" class="btn-redondo" type="button" title="Modo noche" aria-label="Modo noche" aria-pressed="false">
        <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" /></svg>
        <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
      </button>
    </div>

    <button id="btn-seguir" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></svg>
      Seguir recorrido
    </button>

    <section id="panel" class="papel" aria-label="Línea de tiempo e itinerario">
      <button id="asa" type="button" aria-label="Mostrar más o menos itinerario" aria-expanded="false"><span></span></button>

      <div id="cabecera">
        <div id="reloj">
          <div id="fila-hora">
            <p id="hora"></p>
            <button id="btn-velocidad" type="button" aria-label="Velocidad de reproducción">×1</button>
          </div>
          <div id="controles">
            <button id="btn-anterior" class="btn-control" type="button" aria-label="Parada anterior">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5v14M18 5.5 9 12l9 6.5z" /></svg>
            </button>
            <button id="btn-play" class="btn-control principal" type="button" aria-label="Reproducir el día">
              <svg class="icono-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13L18.5 12z" /></svg>
              <svg class="icono-pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" /></svg>
            </button>
            <button id="btn-siguiente" class="btn-control" type="button" aria-label="Parada siguiente">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 5v14M6 5.5 15 12l-9 6.5z" /></svg>
            </button>
          </div>
          <div id="pista">
            <div id="linea"><span id="tramo-ahora"></span><span id="puntos"></span></div>
            <input id="deslizador" type="range" min="0" max="1" step="1" value="0" aria-label="Hora del día" />
            <div id="extremos"><span id="hora-desde"></span><span id="hora-hasta"></span></div>
          </div>
        </div>
        <div id="ahora"></div>
      </div>

      <div id="contenido"></div>
    </section>

    <div id="taxi" hidden>
      <button id="taxi-cerrar" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <p id="taxi-pedir">请带我去这里<small>Lléveme aquí, por favor</small></p>
      <p id="taxi-texto"></p>
      <p id="taxi-direccion"></p>
      <p id="taxi-nombre"></p>
    </div>

    <div id="toast" role="status" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

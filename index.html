<!doctype html>
<html lang="es" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a8804f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Itinerario" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icono-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Itinerario</title>
  </head>
  <body>
    <div id="mapa"></div>

    <header id="barra">
      <div id="tapa">
        <nav id="dias" aria-label="Días del viaje"></nav>
      </div>
      <p id="aviso" hidden></p>
    </header>

    <div id="botones-mapa">
      <button id="btn-encuadrar" class="btn-redondo" type="button" aria-label="Ver el día entero">
        <span class="disco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></span>
        <span class="rotulo" aria-hidden="true">Día</span>
      </button>
      <button id="btn-offline" class="btn-redondo" type="button" aria-label="Guardar mapas para usarlos sin conexión">
        <span class="disco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10.5m0 0-4.5-4.5M12 14.5l4.5-4.5M5 19.5h14" /></svg></span>
        <span class="rotulo" aria-hidden="true">Mapas</span>
      </button>
      <button id="btn-tema" class="btn-redondo" type="button" aria-label="Modo noche" aria-pressed="false">
        <span class="disco">
          <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" /></svg>
          <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" /></svg>
        </span>
        <span class="rotulo" aria-hidden="true">Noche</span>
      </button>
    </div>

    <div id="pildoras">
      <button id="btn-hotel" type="button" aria-label="Llévame al hotel: tarjeta para el taxista">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V8m0 6h18v4M3 12h7V9h8a3 3 0 0 1 3 3v2" /><circle cx="6.5" cy="10.5" r="1.5" class="relleno" /></svg>
        <span>Hotel</span>
      </button>
      <p id="red" role="status" hidden></p>
      <button id="btn-ahora" type="button" hidden>
        <span class="punto-fluor" aria-hidden="true"></span>
        <span>Volver a ahora</span>
      </button>
      <button id="btn-seguir" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        Seguir recorrido
      </button>
    </div>

    <section id="panel" class="papel" aria-label="Línea de tiempo e itinerario">
      <button id="asa" type="button" aria-label="Mostrar más o menos itinerario" aria-expanded="false"><span></span></button>

      <div id="cabecera">
        <div id="reloj">
          <p id="hora"></p>
          <p id="cuenta"></p>
          <div id="controles">
            <button id="btn-anterior" class="btn-control" type="button" aria-label="Parada anterior (repaso)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5v14M18 5.5 9 12l9 6.5z" /></svg>
            </button>
            <button id="btn-play" class="btn-control principal" type="button" aria-label="Repasar el día">
              <svg class="icono-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13L18.5 12z" /></svg>
              <svg class="icono-pausa" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" /></svg>
            </button>
            <button id="btn-siguiente" class="btn-control" type="button" aria-label="Parada siguiente (repaso)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 5v14M6 5.5 15 12l-9 6.5z" /></svg>
            </button>
          </div>
          <div id="pista">
            <div id="linea"><span id="tramo-ahora"></span><span id="puntos"></span></div>
            <input id="deslizador" type="range" min="0" max="1" step="1" value="0" aria-label="Hora del día" />
            <div id="extremos">
              <span id="hora-desde"></span>
              <button id="btn-velocidad" type="button" aria-label="Velocidad del repaso: ×1">×1</button>
              <span id="hora-hasta"></span>
            </div>
          </div>
          <button id="btn-repasar" class="mini suave" type="button">Repasar el día</button>
        </div>
        <div id="ahora"></div>
      </div>

      <div id="contenido"></div>
    </section>

    <p id="anuncio" class="sr" aria-live="polite"></p>

    <div id="taxi" role="dialog" aria-modal="true" aria-labelledby="taxi-texto" hidden>
      <button id="taxi-cerrar" type="button" aria-label="Cerrar la tarjeta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <p id="taxi-pedir"><span lang="zh-Hans">请带我去这里</span><small>Lléveme aquí, por favor</small></p>
      <p id="taxi-texto" lang="zh-Hans"></p>
      <p id="taxi-direccion" lang="zh-Hans"></p>
      <p id="taxi-nombre"></p>
    </div>

    <dialog id="dialogo" aria-labelledby="dialogo-titulo">
      <form method="dialog" class="papel">
        <h2 id="dialogo-titulo"></h2>
        <p id="dialogo-texto"></p>
        <div class="acciones">
          <button value="no" class="boton" type="submit" id="dialogo-no"></button>
          <button value="si" class="boton tinta" type="submit" id="dialogo-si"></button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" hidden><span id="toast-texto"></span><button id="toast-accion" type="button" hidden></button></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
